[Camera]
# index: "auto" picks the first working webcam (external USB cameras are
# preferred over the built-in one; IR cameras are tried last), or set the
# number of a camera as printed by `zimt --list-cameras`.
index = auto
# name: optional, case-insensitive part of the camera's name (for example
# "Logitech"). When set it takes precedence over index.
name =

[Inversion]
# Set to True to flip the direction of movement/rotation
invert_x = True
invert_y = True
invert_yaw = True
invert_pitch = False
invert_roll = False

[Sensitivity]
# Multipliers for movement scale
scale_x = 100
scale_y = 100
gaze_boost = 2.0

[Tracking]
# recalibrate_blinks: blink this many times quickly while looking at the screen
# centre to recalibrate (2 or 3 are sensible; 0 disables it).
recalibrate_blinks = 3
