# Build, test and release zimt (the Zig tracker in zimt/).
#
# All three platforms are built in one Linux container, a SUSE Linux Base
# Container Image pinned by digest, with Zig as the only compiler: Linux
# natively, Windows and macOS cross-compiled. The one exception is the macOS
# camera shim, which needs Apple's SDK and is built on a macOS runner first.
# The finished archives are then started once on each real platform. Every
# build writes a CycloneDX SBOM, which is published with the release.
#
# Releasing: bump .version in zimt/build.zig.zon, merge, then push a tag
# named zimt-v<version> (for example zimt-v0.1.0).
#
# Security model. Keep these properties when editing this file:
#   - Pull requests run on `pull_request`, never `pull_request_target`, so
#     code from a fork runs with a read-only token and no secrets.
#   - The token has no permissions by default; only the release job, which
#     runs for tags alone and runs no code from the repository, can write.
#   - Actions are pinned to full commit SHAs (Dependabot keeps them current).
#   - The build image is pinned by digest. Dependabot does not update it: to
#     move to a newer image, replace the digest by hand with the one
#     `docker buildx imagetools inspect registry.suse.com/bci/bci-base:15.7`
#     prints.
#   - No caches: a cache written by a pull request could poison a release.
#   - No `${{ }}` expression is expanded inside a script; values reach
#     scripts through environment variables.
name: zimt

on:
  pull_request:
    paths:
      - zimt/**
      - .github/workflows/zimt.yml
  push:
    branches: [master]
    tags: ['zimt-v*']
    paths:
      - zimt/**
      - .github/workflows/zimt.yml

permissions: {}

concurrency:
  group: zimt-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag must match build.zig.zon; any other build is named after its commit.
      - id: version
        run: |
          zon_version="$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' zimt/build.zig.zon)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#zimt-v}"
            if [ "$version" != "$zon_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $zon_version in build.zig.zon"
              exit 1
            fi
          else
            version="$zon_version-${GITHUB_SHA:0:7}"
          fi
          if ! [[ "$version" =~ ^[0-9A-Za-z.-]+$ ]]; then
            echo "::error::Unexpected characters in the version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The macOS camera shim is the only part that cannot be built in the Linux
  # container. The unit tests run here too, so they also run on macOS.
  shim-macos:
    name: shim (aarch64-macos)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: zimt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: brew install cmake

      - name: Test
        run: make test

      - name: Build the shim
        run: make shim

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shim-aarch64-macos
          path: zimt/dist/libzimt_cv.dylib
          if-no-files-found: error
          retention-days: 1

  build:
    name: build (${{ matrix.target }})
    needs: [version, shim-macos]
    runs-on: ubuntu-24.04
    container: registry.suse.com/bci/bci-base:15.7@sha256:8cd100ae2ec5ab23d6ec7aa1c0fe2dc30ca852c609406097797c9d298b7decdd
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux, x86_64-windows, aarch64-macos]
    defaults:
      run:
        shell: bash
        working-directory: zimt
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: zypper --non-interactive install --no-recommends make cmake nasm unzip xz

      - name: Fetch the macOS shim
        if: matrix.target == 'aarch64-macos'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shim-aarch64-macos
          path: zimt/dist-aarch64-macos

      - name: Test
        if: matrix.target == 'x86_64-linux'
        run: make test

      # The Makefile downloads Zig, the OpenCV source, MediaPipe and the
      # model, and verifies each against a SHA-256 pinned in the Makefile.
      - name: Build and package
        run: make package TARGET="$TARGET" VERSION="$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zimt-${{ matrix.target }}
          path: zimt/pkg/*
          if-no-files-found: error
          retention-days: 14

  # Starts each archive on the platform it is for, with nothing installed.
  # The runners have no camera, so zimt is expected to load its camera
  # library and then stop because it finds none.
  smoke:
    name: smoke (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-24.04
          - target: x86_64-windows
            os: windows-2025
          - target: aarch64-macos
            os: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zimt-${{ matrix.target }}

      - name: Run
        run: |
          if [ -f zimt-*.zip ]; then unzip -q zimt-*.zip; else tar -xzf zimt-*.tar.gz; fi
          cd zimt-*/
          ./zimt --help
          ./zimt --list-cameras
          output="$(./zimt 2>&1 || true)"
          echo "$output"
          grep -q "Detected cameras" <<<"$output"

  release:
    name: release
    if: github.ref_type == 'tag'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Add required reviewers and a "zimt-v*" tag rule to this environment in
    # the repository settings to make every release need an approval.
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zimt-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum zimt-* | tee SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/zimt-*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
